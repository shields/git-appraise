on: [push, pull_request]
name: Build and Test
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Check formatting (Linux only)
      if: runner.os == 'Linux'
      run: |
        test -z "$(gofmt -l .)"
    - name: Vet
      run: go vet ./...
    - name: Build and test
      run: |
        go build ./...
        go test -v ./...
