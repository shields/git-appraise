on: [push, pull_request]
name: Build and Test
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Check formatting (Linux only)
      if: runner.os == 'Linux'
      run: |
        test -z "$(gofmt -l .)"
    - name: Vet
      run: go vet ./...
    - name: Build and test
      run: |
        go build ./...
        go test -v ./...
